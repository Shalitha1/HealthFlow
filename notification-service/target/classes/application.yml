spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

app:
  kafka:
    patient-events-topic: ${PATIENT_EVENTS_TOPIC:patient-events}

notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    from: ${NOTIFICATIONS_EMAIL_FROM:no-reply@patient-management.local}

logging:
  level:
    root: INFO
    com.pm: DEBUG
