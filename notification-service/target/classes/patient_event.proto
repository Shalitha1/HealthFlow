syntax = "proto3";

package com.pm.event;

option java_multiple_files = true;
option java_package = "com.pm.event";
option java_outer_classname = "PatientEventProto";

message PatientCreatedEvent {
  int64 patient_id = 1;
  string name = 2;
  string email = 3;
  string address = 4;
  string date_of_birth = 5;
  int64 created_at = 6;
}
