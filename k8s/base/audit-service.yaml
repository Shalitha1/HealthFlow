apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-service-config
data:
  SERVER_PORT: "8083"
  DB_PORT: "5432"
  DB_NAME: audit_db
  DB_USERNAME: admin
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP_ID: audit-service
  PATIENT_EVENTS_TOPIC: patient-events
---
apiVersion: v1
kind: Secret
metadata:
  name: audit-service-secret
type: Opaque
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: audit-service
          image: audit-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: audit-service-config
            - secretRef:
                name: audit-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
    - name: http
      port: 8083
      targetPort: http
