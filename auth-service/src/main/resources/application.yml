spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # Adopt databases created before Flyway without deleting existing users.
    # Empty databases still run V1 normally.
    baseline-on-migrate: true

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:this-is-a-very-secure-secret-key-with-at-least-32-characters}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: HealthFlow authentication service
    version: 0.0.1-SNAPSHOT
